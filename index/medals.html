<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medallas | CAMO COD HQ</title>
<style>
:root{--bg:#05060a;--surface:#101722;--muted:#98a0b3;--gold:#ffcc33;--cyan:#06b6d4;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;padding:24px;color:#fff;background:radial-gradient(circle at top,#101b31 0,var(--bg) 52%);font:16px Inter,system-ui,sans-serif}.container{width:min(100%,1000px);margin:auto}.nav{display:flex;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--border)}a{color:inherit;text-decoration:none}.btn{padding:8px 12px;border:1px solid var(--border);border-radius:8px}.btn:hover{border-color:var(--cyan);color:var(--cyan)}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,64px);margin:0}.summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;background:rgba(16,23,34,.72)}.summary strong{color:var(--gold);font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.medal{position:relative;min-height:190px;padding:18px;border:1px solid var(--border);border-left:4px solid #596273;border-radius:10px;background:linear-gradient(145deg,rgba(16,23,34,.96),rgba(9,13,20,.92));transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}.medal:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 8px 22px rgba(0,0,0,.24)}.medal.earned{border-top-color:rgba(255,255,255,.16)}.medal.bronze{border-left-color:#cd7f32}.medal.silver{border-left-color:#c0c0c0}.medal.gold{border-left-color:var(--gold)}.medal.diamond{border-left-color:#67e8f9}.icon{display:inline-grid;place-items:center;width:48px;height:48px;margin:2px 0 14px;border:1px solid rgba(255,204,51,.38);border-radius:50%;color:var(--gold);font-size:27px;background:rgba(255,204,51,.1)}.locked .icon{border-color:rgba(152,160,179,.3);color:#798496;background:rgba(152,160,179,.08)}.name{display:block;max-width:90%;margin:0 0 8px;font-size:16px;font-weight:800;line-height:1.25}.meta{color:var(--muted);font-size:13px;line-height:1.45}.locked{opacity:.62}.lock{position:absolute;top:17px;right:17px;font-size:17px}.game-tag{display:block;width:max-content;max-width:100%;margin-bottom:10px;padding:4px 8px;border:1px solid rgba(6,182,212,.35);border-radius:5px;color:var(--cyan);font-size:10px;font-weight:800;line-height:1.2;white-space:normal}
@media(max-width:600px){body{padding:14px}.nav{padding-bottom:14px}.grid{grid-template-columns:1fr;gap:10px}.medal{min-height:0;padding:16px}.summary{gap:10px}.name{font-size:15px}}
</style>
</head>
<body><nav class="nav container"><a id="profileLink" href="profile.html">Perfil</a><a class="btn" href="leaderboard.html">Leaderboard</a></nav><main class="container"><p class="eyebrow">Colección</p><h1>Medallas</h1><section class="grid" id="medals"><p class="meta">Cargando medallas...</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const config=window.CAMO_SUPABASE_CONFIG||{};
const client=config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey):null;
const userId=new URLSearchParams(location.search).get('user');
if(userId)document.querySelector('#profileLink').href=`profile.html?user=${encodeURIComponent(userId)}`;
const total=668;
const games=['Modern Warfare 2007','Modern Warfare 2','Black Ops','Modern Warfare 3','Black Ops II','Ghosts','Advanced Warfare','Black Ops III','Infinite Warfare','Modern Warfare Remastered','WWII','Black Ops IIII','Mobile','Modern Warfare 2019','Modern Warfare 2 Remastered','Black Ops Cold War','Vanguard','Modern Warfare II','Modern Warfare III','Black Ops 6','Black Ops 7','Modern Warfare 4','Warzone'];
const quantityMedals=Array.from({length:20},(_,index)=>(index+1)*50);
const tierFor=amount=>amount<=250?'bronze':amount<=500?'silver':amount<=750?'gold':'diamond';
const catalog=[['completion','Maestro del camuflaje','Completar un juego al 100%','gold'],['category','Categoría completa','Completar todas las categorías','silver'],['streak','Racha de progreso','Alcanzar una racha de progreso','bronze'],['top3','Top 3 del leaderboard','Quedar entre los tres primeros','gold'],...quantityMedals.map(amount=>[`quantity:${amount}`,`${amount} camuflajes`,`Conseguir ${amount} camuflajes`,tierFor(amount)]),['allGames','Completista total','Completar todos los juegos','diamond'],...games.map(game=>[`game:${game}`,`${game} completado`,`Completar ${game} al 100%`,'diamond'])];
const render=async()=>{
	const root=document.querySelector('#medals');
	if(!client||!userId){root.innerHTML='<p class="meta">Perfil no disponible.</p>';return;}
	const [{data:profile},{data:ranking}]=await Promise.all([
		client.from('leaderboard_stats').select('completed,selected_medals,medal_earned_at,game_progress').eq('user_id',userId).maybeSingle(),
		client.from('leaderboard_stats').select('user_id,completed')
	]);
	const completed=profile?.completed||0;
	const gameProgress=profile?.game_progress||{};
	const values=games.map(game=>gameProgress[game]||(game==='Modern Warfare 2019'?completed:0));
	const rank=[...(ranking||[])].sort((a,b)=>b.completed-a.completed).findIndex(item=>item.user_id===userId)+1;
	const earned={completion:completed>=total,category:completed>=total,streak:completed>=100,top3:rank>0&&rank<=3,allGames:values.every(value=>value>=total),...Object.fromEntries(quantityMedals.map(amount=>[`quantity:${amount}`,completed>=amount]))};
	games.forEach((game,index)=>{earned[`game:${game}`]=values[index]>=total;});
	const unlocked=catalog.filter(([key])=>earned[key]).length;
	const summary=document.createElement('p');
	summary.className='summary';
	summary.innerHTML=`<span><strong>${unlocked}</strong> de ${catalog.length} desbloqueadas</span>`;
	root.replaceWith(summary);
	const grid=document.createElement('section');
	grid.id='medals';
	grid.className='grid';
	summary.after(grid);
	const dates=profile?.medal_earned_at||{};
	const tierClass={bronze:'bronze',silver:'silver',gold:'gold',diamond:'diamond'};
	grid.innerHTML=catalog.map(([key,name,description,tier])=>{
		const isEarned=earned[key];
		const date=dates[key];
		const tag=key.startsWith('game:')?key.slice(5):'LOGRO';
		return `<article class="medal ${isEarned?'earned '+(tierClass[tier]||''):'locked'}"><span class="lock">${isEarned?'':'🔒'}</span><span class="game-tag">${tag}</span><span class="icon">${isEarned?'★':'☆'}</span><span class="name">${name}</span><span class="meta">${description}</span><br><span class="meta">${isEarned?(date?'Conseguida el '+new Intl.DateTimeFormat('es-ES').format(new Date(date)):'Desbloqueada'):'Bloqueada'}</span></article>`;
	}).join('');
};
render().catch(() => { document.querySelector('#medals').innerHTML='<p class="meta">No se pudieron cargar las medallas.</p>'; });
</script></body></html>
