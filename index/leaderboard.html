<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060a">
    <title>Leaderboard | CAMO COD HQ</title>
    <style>
        :root {
            --bg: #05060a;
            --surface: #0f1724;
            --surface-light: #151f2e;
            --muted: #98a0b3;
            --accent: #7c3aed;
            --accent-2: #06b6d4;
            --gold: #ffcc33;
            --border: rgba(255, 255, 255, 0.1);
            --ff: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #fff;
            background: radial-gradient(circle at top, #101b31 0, var(--bg) 48%);
            font-family: var(--ff);
        }

        a { color: inherit; text-decoration: none; }

        .container {
            width: min(100%, 1100px);
            margin: 0 auto;
        }

        .site-header {
            border-bottom: 1px solid var(--border);
            background: rgba(5, 6, 10, 0.8);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 78px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            overflow: hidden;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text { display: grid; gap: 2px; }
        .site-name { font-weight: 800; letter-spacing: 0.04em; }
        .site-tag { color: var(--muted); font-size: 12px; }

        .btn.ghost {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: inherit;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }

        main { padding: 64px 0; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent-2);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(36px, 7vw, 72px); line-height: 0.95; }
        .intro { max-width: 620px; margin: 18px 0 40px; color: var(--muted); line-height: 1.6; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin: 0 0 28px;
        }

        .stat-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(16, 23, 34, 0.85);
        }

        .stat-card .label {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-card .value {
            display: block;
            margin-top: 12px;
            color: #fff;
            font-size: clamp(22px, 3vw, 30px);
            font-weight: 800;
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 0 0 28px;
        }

        .podium-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(23, 31, 48, 0.96), rgba(12, 17, 27, 0.9));
            text-align: center;
        }

        .podium-card.gold { border-color: rgba(255, 204, 51, 0.4); }
        .podium-card.silver { border-color: rgba(191, 201, 214, 0.4); }
        .podium-card.bronze { border-color: rgba(205, 127, 50, 0.4); }

        .podium-rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .podium-card.gold .podium-rank { background: rgba(255, 204, 51, 0.2); color: var(--gold); }
        .podium-card.silver .podium-rank { background: rgba(191, 201, 214, 0.2); color: #dfe7ef; }
        .podium-card.bronze .podium-rank { background: rgba(205, 127, 50, 0.2); color: #e29b5a; }

        .podium-name {
            display: block;
            margin: 12px 0 6px;
            font-size: 18px;
            font-weight: 800;
        }

        .podium-score {
            color: var(--gold);
            font-weight: 700;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 24px;
        }

        .search-box {
            flex: 1 1 260px;
            min-width: 220px;
        }

        .search-box input,
        .sort-box select {
            width: 100%;
            padding: 12px 14px;
            color: #fff;
            background: rgba(11, 17, 26, 0.9);
            border: 1px solid var(--border);
            border-radius: 10px;
            font: inherit;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-button,
        .sort-box {
            flex: 0 0 auto;
        }

        .filter-button {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font: inherit;
            transition: all 0.2s ease;
        }

        .filter-button.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: white;
        }

        .sort-box {
            min-width: 180px;
        }

        .leaderboard {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(21, 31, 46, 0.92), rgba(15, 23, 36, 0.78));
        }

        .leaderboard-header,
        .leaderboard-row {
            display: grid;
            grid-template-columns: 80px minmax(0, 1fr) 180px;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
        }

        .leaderboard-header {
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .leaderboard-row { border-bottom: 1px solid var(--border); }
        .leaderboard-row:last-child { border-bottom: 0; }
        .rank { color: var(--accent-2); font-weight: 900; }
        .rank-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .rank-icon { width: 34px; height: 34px; object-fit: contain; }
        .name-icon { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
        .player { font-weight: 700; }
        .score { color: var(--gold); font-weight: 800; text-align: right; }
        .player { color: var(--cyan); }
        .message { color: var(--muted); padding: 22px; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .nav { min-height: 68px; }
            main { padding: 44px 0; }
            .leaderboard-header,
            .leaderboard-row { grid-template-columns: 72px minmax(0, 1fr) 110px; padding: 16px; }
            .rank-icon { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="Navegación principal">
            <a class="brand" href="Camos UEM.html">
                <span class="logo"><img src="../MW 2019/logo.png" alt="CAMO COD HQ"></span>
                <span class="brand-text">
                    <span class="site-name">CAMO COD HQ</span>
                    <small class="site-tag">Tu hub de camuflajes</small>
                </span>
            </a>
            <a class="btn ghost" href="Camos UEM.html">Volver</a>
        </nav>
    </header>

    <main class="container">
        <p class="eyebrow">CAMO COD HQ</p>
        <h1>Leaderboard</h1>
        <p class="intro">Clasificación global de camuflajes completados por la comunidad.</p>

        <div class="stats-grid" id="statsGrid" aria-live="polite"></div>
        <div class="podium" id="podium" aria-live="polite"></div>

        <div class="toolbar" aria-label="Herramientas del leaderboard">
            <div class="search-box">
                <input id="leaderboardSearch" type="text" placeholder="Buscar jugador..." aria-label="Buscar jugador" />
            </div>
            <div class="filters" aria-label="Filtros de rango">
                <button class="filter-button active" type="button" data-limit="10">Top 10</button>
                <button class="filter-button" type="button" data-limit="25">Top 25</button>
                <button class="filter-button" type="button" data-limit="50">Top 50</button>
                <button class="filter-button" type="button" data-limit="all">Todos</button>
            </div>
            <div class="sort-box">
                <select id="leaderboardSort" aria-label="Ordenar por">
                    <option value="completed">Total de camuflajes</option>
                    <option value="progress">Progreso %</option>
                    <option value="position">Posición global</option>
                </select>
            </div>
        </div>

        <section class="leaderboard" aria-labelledby="leaderboard-title">
            <h2 id="leaderboard-title" hidden>Clasificación de jugadores</h2>
            <div class="leaderboard-header">
                <span>Posición</span>
                <span>Jugador</span>
                <span>Puntuación</span>
            </div>
            <p class="message" id="leaderboardMessage">Cargando clasificación...</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const config = window.CAMO_SUPABASE_CONFIG || {};
        const client = config.url && config.anonKey ? window.supabase.createClient(config.url, config.anonKey) : null;
        const countProgress = progress => Object.values(progress || {}).reduce((total, indices) => total + (Array.isArray(indices) ? indices.length : 0), 0);
        const state = { limit: 10, sortBy: 'completed', search: '' };

        const renderTopStats = (scores) => {
            const statsGrid = document.querySelector('#statsGrid');
            const podium = document.querySelector('#podium');
            const activePlayers = scores.length;
            const bestPlayer = scores[0] || null;
            const average = activePlayers ? Math.round(scores.reduce((sum, player) => sum + player.completed, 0) / activePlayers) : 0;
            const totalCompleted = scores.reduce((sum, player) => sum + player.completed, 0);

            const statCards = [
                { label: 'Jugadores activos', value: activePlayers },
                { label: 'Media global', value: average },
                { label: 'Mejor jugador', value: bestPlayer ? bestPlayer.username : '—' },
                { label: 'Total camuflajes', value: totalCompleted }
            ];

            statsGrid.innerHTML = statCards.map(card => `
                <div class="stat-card">
                    <span class="label">${card.label}</span>
                    <span class="value">${card.value}</span>
                </div>
            `).join('');

            const podiumPlayers = scores.slice(0, 3);
            podium.innerHTML = podiumPlayers.map((player, index) => {
                const rank = ['oro', 'plata', 'bronce'][index];
                const label = ['1º', '2º', '3º'][index];
                const className = index === 0 ? 'gold' : index === 1 ? 'silver' : 'bronze';
                return `
                    <div class="podium-card ${className}">
                        <div class="podium-rank">${label}</div>
                        <span class="podium-name">${player.username}</span>
                        <div class="podium-score">${player.completed} camuflajes</div>
                    </div>
                `;
            }).join('');
        };

        const renderLeaderboard = (scores) => {
            const board = document.querySelector('.leaderboard');
            const message = document.querySelector('#leaderboardMessage');
            const searchValue = state.search.trim().toLowerCase();
            const filtered = (scores || []).filter(player => {
                if (!searchValue) return true;
                return (player.username || '').toLowerCase().includes(searchValue);
            });

            const sorted = filtered.slice().sort((a, b) => {
                if (state.sortBy === 'progress') return (b.completed / 668) - (a.completed / 668);
                if (state.sortBy === 'position') return a.completed - b.completed;
                return b.completed - a.completed;
            });

            const limited = state.limit === 'all' ? sorted : sorted.slice(0, Number(state.limit));
            message.remove();
            const existingRows = board.querySelectorAll('.leaderboard-row');
            existingRows.forEach(row => row.remove());
            if (!limited.length) {
                board.insertAdjacentHTML('beforeend', '<p class="message">No hay jugadores que coincidan con tu búsqueda.</p>');
                return;
            }

            limited.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';

                const rankCell = document.createElement('span');
                rankCell.className = 'rank-cell';
                if (index < 3) {
                    const rankIcon = document.createElement('img');
                    rankIcon.className = 'rank-icon';
                    rankIcon.src = `rank icon/leaderboards-rank-${index + 1}.png`;
                    rankIcon.alt = `Rango ${index + 1}`;
                    rankCell.appendChild(rankIcon);
                }

                const rank = document.createElement('span');
                rank.className = 'rank';
                rank.textContent = `#${index + 1}`;
                rankCell.appendChild(rank);

                const playerLink = document.createElement('a');
                playerLink.className = 'player';
                playerLink.href = `profile.html?user=${encodeURIComponent(player.user_id)}`;
                playerLink.textContent = player.username;
                if (/^#[0-9a-f]{6}$/i.test(player.accent_color || '')) {
                    playerLink.style.color = player.accent_color;
                }
                if (player.icon_url) {
                    const nameIcon = document.createElement('img');
                    nameIcon.className = 'name-icon';
                    nameIcon.src = player.icon_url;
                    nameIcon.alt = 'Icono del usuario';
                    playerLink.prepend(nameIcon);
                }

                const score = document.createElement('span');
                score.className = 'score';
                score.textContent = `${player.completed} camuflajes`;

                row.append(rankCell, playerLink, score);
                board.appendChild(row);
            });
        };

        const loadLeaderboard = async () => {
            const message = document.querySelector('#leaderboardMessage');
            if (!client) { message.textContent = 'Supabase no está configurado.'; return; }
            const [{ error: profileError }, { data: progressRows, error: progressError }] = await Promise.all([
                client.from('profiles').select('user_id, username').limit(1),
                client.from('leaderboard_stats').select('user_id, username, completed, accent_color, icon_url')
            ]);
            if (profileError || progressError) throw profileError || progressError;
            const scores = (progressRows || []).sort((a, b) => b.completed - a.completed);
            renderTopStats(scores);
            const searchInput = document.querySelector('#leaderboardSearch');
            const sortSelect = document.querySelector('#leaderboardSort');
            const filterButtons = document.querySelectorAll('.filter-button');

            searchInput.addEventListener('input', (event) => {
                state.search = event.target.value;
                renderLeaderboard(scores);
            });

            sortSelect.addEventListener('change', (event) => {
                state.sortBy = event.target.value;
                renderLeaderboard(scores);
            });

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    state.limit = button.dataset.limit;
                    filterButtons.forEach(item => item.classList.toggle('active', item === button));
                    renderLeaderboard(scores);
                });
            });

            renderLeaderboard(scores);
        };

        loadLeaderboard().catch(() => { document.querySelector('#leaderboardMessage').textContent = 'No se pudo cargar la clasificación.'; });
    </script>
</body>
</html>
