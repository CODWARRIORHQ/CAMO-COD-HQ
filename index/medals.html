<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medallas | CAMO COD HQ</title>
<style>
:root{--bg:#05060a;--surface:#101722;--muted:#98a0b3;--gold:#ffcc33;--cyan:#06b6d4;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;padding:24px;color:#fff;background:radial-gradient(circle at top,#101b31 0,var(--bg) 52%);font:16px Inter,system-ui,sans-serif}.container{width:min(100%,1000px);margin:auto}.nav{display:flex;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--border)}a{color:inherit;text-decoration:none}.btn{padding:8px 12px;border:1px solid var(--border);border-radius:8px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,64px);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:30px}.medal{padding:20px;border:1px solid var(--border);border-radius:10px;background:rgba(16,23,34,.86)}.medal.earned{border-color:rgba(255,204,51,.5)}.icon{font-size:32px;color:var(--gold)}.name{display:block;margin:12px 0 6px;font-weight:800}.meta{color:var(--muted);font-size:13px}.locked{filter:grayscale(1);opacity:.55}
</style>
</head>
<body><nav class="nav container"><a href="profile.html">Perfil</a><a class="btn" href="leaderboard.html">Leaderboard</a></nav><main class="container"><p class="eyebrow">Colección</p><h1>Medallas</h1><section class="grid" id="medals"><p class="meta">Cargando medallas...</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const config=window.CAMO_SUPABASE_CONFIG||{};const client=config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey):null;const userId=new URLSearchParams(location.search).get('user');const catalog=[['completion','Maestro del camuflaje','Completar un juego al 100%'],['category','Categoría completa','Completar una categoría de armas'],['streak','Racha de progreso','Alcanzar una racha de progreso'],['top3','Top 3 del leaderboard','Quedar entre los tres primeros'],['bronze','Nivel bronce','Más de 100 camuflajes'],['silver','Nivel plata','Más de 250 camuflajes'],['gold','Nivel oro','Más de 500 camuflajes'],['diamond','Nivel diamante','Completar un juego al 100%']];
const render=async()=>{const root=document.querySelector('#medals');if(!client||!userId){root.innerHTML='<p class="meta">Perfil no disponible.</p>';return}const {data:profile}=await client.from('leaderboard_stats').select('completed,selected_medals,medal_earned_at').eq('user_id',userId).maybeSingle();const completed=profile?.completed||0;const selected=profile?.selected_medals||[];const earned={completion:completed>=668,category:completed>=668,streak:completed>=100,top3:selected.includes('top3'),bronze:completed>=100,silver:completed>=250,gold:completed>=500,diamond:completed>=668};root.innerHTML=catalog.map(([key,name,description])=>{const unlocked=earned[key];const date=profile?.medal_earned_at?.[key];return `<article class="medal ${unlocked?'earned':'locked'}"><span class="icon">${unlocked?'★':'☆'}</span><span class="name">${name}</span><span class="meta">${description}</span><br><span class="meta">${unlocked?(date?'Conseguida el '+new Intl.DateTimeFormat('es-ES').format(new Date(date)):'Conseguida'):'Bloqueada'}</span></article>`}).join('')};render();
</script></body></html>
